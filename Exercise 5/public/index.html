<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI SDK Tools Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>AI SDK Tools Chat</h1>
      <button id="resetBtn" title="Clear conversation">Reset</button>
    </header>
    <div id="messages"></div>
    <form id="chatForm">
      <input id="chatInput" type="text" placeholder="Ask about movies, users, reviews, or ask for a joke..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
